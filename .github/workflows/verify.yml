name: Verify product handoff
on:
  push:
    branches: [main]
    paths: ['backend/**', 'scripts/**', 'research/**', 'requirements*.txt', 'frontend/**', '.github/workflows/verify.yml']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            research/requirements.txt
      - run: python -m pip install -r requirements.txt -r research/requirements.txt
      - run: python -B -m pytest -q backend/tests research/test_context_similarity_ab.py research/test_assistant_case_acceptance.py
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm run build:pages
